<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
            let dayNumber=5;
            console.log(`${dayNumber} - პარასკევი`);

            const score=Math.floor(Math.random()*100);
            if(score>90){
                console.log("perfect");
            }
            else if(score>60 && score<90){
                console.log("decent");
            }
            else{
                console.log("Fired");
            }
            
            const year=2024;
            if(year%4===0){
                console.log("ეს წელი ნაკიანია")
            }
            else{
                console.log("ეს წელი არ არის ნაკიანი")
            }

            let number=89;
            if(number===0){
                console.log(0)
            }
            else if(number>0 && number%2===0){
                console.log(number)
            }
            else if(number>0 && number%2!==0){
                console.log(number)
            }
            else{
                console.log(number)
            }

            let a=Math.floor(Math.random()*100);
            let b=Math.floor(Math.random()*100);
            let c=Math.floor(Math.random()*100);
            if(a>b && a>c){
                console.log(a)
            }
            else if(b>a && b>c){
                console.log(b)
            }
            else if (c>a && c>b){
                console.log(c)
            }
            else{
                console.log("a=b=c")
            }
        </script>
    </body>
</html>
